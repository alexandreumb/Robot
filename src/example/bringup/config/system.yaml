---
controller_manager:
  ros__parameters:
    use_sim_time: false  # Set to true if using Gazebo/simulation
    cpu_affinity: 2
    update_rate: 500
    thread_priority: 85

    joint_state_broadcaster:
      type: "joint_state_broadcaster/JointStateBroadcaster"
    
    gps_sensor_broadcaster:
      type: "gps_sensor_broadcaster/GPSSensorBroadcaster"

    ackermann_steering_controller:    
      type: "ackermann_steering_controller/AckermannSteeringController"
    
    robot_steering_controller:    
      type: "robot_steering_controller/RobotSteeringController"
        

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: false  # Set to true if using Gazebo/simulation
    joints: ["front_wheels_joint", "rear_wheels_joint"]

robot_steering_controller:
  ros__parameters:
    use_sim_time: false  # Set to true if using Gazebo/simulation
    position_feedback: false
    wheelbase: 1.5
    max_steering_angle: 30.0
    max_velocity: 6.0
    min_velocity: -5.0
    front_wheels_radius: 0.203
    rear_wheels_radius: 0.203
    reference_timeout: 1.0
    axes_names: ["front_wheels_joint", "rear_wheels_joint"]
    direction_names: ["direction_joint"]
    gps_sensor_names: ["gps_sensor"]
    front_wheel_track: 1.26
    rear_wheel_track: 1.36
    base_frame_id: base_link
    odom_frame_id: odom
    enable_odom_tf: true
    use_stamped_vel: true
    open_loop: false
    cmd_topic: "/robot_cmd"  # controller will subscribe to this
    read: 0
    file_name: ""
    stop_distance: 1.5
    slow_distance: 3.0

gps_sensor_broadcaster:
  ros__parameters:
    use_sim_time: false  # Set to true if using Gazebo/simulation
    use_local_topics: true
    frame_id: gps_link
    sensors: ["gps_sensor"]
    interfaces: ["latitude", "longitude", "height"]
