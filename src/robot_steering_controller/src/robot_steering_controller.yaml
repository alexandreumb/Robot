robot_steering_controller:
  reference_timeout: {
    type: double,
    default_value: 1.0,
    description: "Timeout for controller references after which they will be reset. This is especially useful for controllers that can cause unwanted and dangerous behaviour if reference is not reset, e.g., velocity controllers. If value is 0 the reference is reset after each run.",
  }

  axes_names:
    {
      type: string_array,
      description: "Names of the joints that control the speed of the wheels. For details see: https://en.wikipedia.org/wiki/Wheelbase",
      default_value: [],
      read_only: true,
      validation: {
        size_lt<>: [3],
        unique<>: null,
      }
    }
    
  direction_names:
    {
      type: string_array,
      description: "Names of the joints that control the steering direction. For details see: https://en.wikipedia.org/wiki/Wheelbase",
      default_value: [],
      read_only: true,
      validation: {
        size_lt<>: [2],
        unique<>: null,
      }
    }

  front_wheel_track:
    {
      type: double,
      default_value: 0.0,
      description: "Front wheel track length. For details see: https://en.wikipedia.org/wiki/Wheelbase",
      read_only: false,
      validation: {
        gt<>: [0.0]
      }
    }

  rear_wheel_track:
    {
      type: double,
      default_value: 0.0,
      description: "Rear wheel track length. For details see: https://en.wikipedia.org/wiki/Wheelbase",
      read_only: false,
      validation: {
        gt<>: [0.0]
      }
    }

  wheelbase:
    {
      type: double,
      default_value: 0.0,
      description: "Distance between front and rear wheels. For details see: https://en.wikipedia.org/wiki/Wheelbase",
      read_only: false,
      validation: {
        gt<>: [0.0]
      }
    }

  front_wheels_radius:
    {
      type: double,
      default_value: 0.0,
      description: "Front wheels radius.",
      read_only: false,
      validation: {
        gt<>: [0.0]
      }
    }

  rear_wheels_radius:
    {
      type: double,
      default_value: 0.0,
      description: "Rear wheels radius.",
      read_only: false,
      validation: {
        gt<>: [0.0]
      }
    }

  open_loop: {
    type: bool,
    default_value: false,
    description: "Choose if open-loop or not (feedback) is used for odometry calculation.",
    read_only: false,
  }

  position_feedback: {
    type: bool,
    default_value: false,
    description: "Choice of feedback type, if position_feedback is false then ``HW_IF_VELOCITY`` is taken as interface type, if
    position_feedback is true then ``HW_IF_POSITION`` is taken as interface type",
    read_only: false,
  }

  base_frame_id: {
    type: string,
    default_value: "base_link",
    description: "Base frame_id set to value of base_frame_id.",
    read_only: false,
  }

  odom_frame_id: {
    type: string,
    default_value: "odom",
    description: "Odometry frame_id set to value of odom_frame_id.",
    read_only: false,
  }

  twist_covariance_diagonal: {
    type: double_array,
    default_value: [0.0, 7.0, 14.0, 21.0, 28.0, 35.0],
    description: "diagonal values of twist covariance matrix.",
    read_only: false,
  }

  pose_covariance_diagonal: {
    type: double_array,
    default_value: [0.0, 7.0, 14.0, 21.0, 28.0, 35.0],
    description: "diagonal values of pose covariance matrix.",
    read_only: false,
  }
  
  gps_sensor_names:
    {
      type: string_array,
      description: "Gps names",
      default_value: [],
      read_only: true,
      validation: {
        size_lt<>: [5],
        unique<>: null,
      }
    }
  
  enable_odom_tf: {
    type: bool,
    default_value: true,
    description: "Publishing to tf is enabled or disabled?",
    read_only: false,
  }

  reduce_wheel_speed_until_steering_reached: {
    type: bool,
    default_value: false,
    description: "Reduce wheel speed until the steering angle has been reached.",
    read_only: false,
  }
  
  velocity_rolling_window_size: {
    type: int,
    default_value: 10,
    description: "The number of velocity samples to average together to compute the odometry twist.linear.x and twist.angular.z velocities.",
    read_only: false,
  }

  use_stamped_vel: {
    type: bool,
    default_value: true,
    description: "Choice of vel type, if use_stamped_vel is false then ``geometry_msgs::msg::Twist`` is taken as vel msg type, if
    use_stamped_vel is true then ``geometry_msgs::msg::TwistStamped`` is taken as vel msg type",
    read_only: false,
  }

  max_steering_angle: {
    type: double,
    default_value: 30.0,
    description: "Maximum steering angle in degrees.",
    read_only: false,
  }

  max_velocity: {
    type: double,
    default_value: 0.0,
    description: "Maximum velocity of the robot in m/s.",
    read_only: false,
  }

  min_velocity: {
    type: double,
    default_value: 0.0,
    description: "Minimum velocity of the robot in m/s.",
    read_only: false,
  }

  read: {
    type: int,
    default_value: 0,
    description: "Whether to read from file or not.",
    read_only: false,
  }

  file_name: {
    type: string,
    default_value: "",
    description: "File name to read from.",
    read_only: false,
  }

  stop_distance: {
    type: double,
    default_value: 0.0,
    description: "Distance to stop the robot in meters.",
    read_only: false,
  }

  slow_distance: {
    type: double,
    default_value: 0.0,
    description: "Distance to slow down the robot in meters.",
    read_only: false,
  }
